name: Test

on:
  push:
    branches: ["main", "staging"]
  pull_request:
  # Lets staging.yml/production.yml run this as their own test job via
  # `uses: ./.github/workflows/test.yml` instead of duplicating the matrix.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["4.2", "5.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django-version }}.0"
          pip install -e ".[drf,dev]"

      - name: Run pytest
        run: pytest --cov=shopify_toolkit --cov-report=term-missing

      - name: Check migrations are in sync with models
        run: |
          python -c "
          import django
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'tests.settings')
          django.setup()
          from django.core.management import call_command
          call_command('makemigrations', 'shopify_toolkit', '--check', '--dry-run')
          "
