name: Test

on:
  push:
    branches-ignore: ["main", "staging"]
  # Lets staging.yml/production.yml run this as their own test job via
  # `uses: ./.github/workflows/test.yml` instead of duplicating the matrix.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["4.2", "5.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django-version }}.0"
          pip install -e ".[drf,dev]"

      - name: Run pytest
        # `python -m pytest`, not bare `pytest` — the module form adds the
        # repo root to sys.path early enough for pytest-django to import
        # DJANGO_SETTINGS_MODULE ("tests.settings"). The bare `pytest`
        # console script doesn't, and fails with "No module named 'tests'".
        run: python -m pytest --cov=shopify_toolkit --cov-report=term-missing

      - name: Check migrations are in sync with models
        run: |
          python -c "
          import django
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'tests.settings')
          django.setup()
          from django.core.management import call_command
          call_command('makemigrations', 'shopify_toolkit', '--check', '--dry-run')
          "

  test-mongodb:
   
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start MongoDB (single-node replica set — required for transactions)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all

          echo "Waiting for mongod to accept connections..."
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" && break
            sleep 1
          done

          echo "Initiating replica set with an explicit, host-reachable member address..."
          docker exec mongo mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'

          echo "Waiting for primary election..."
          for i in $(seq 1 30); do
            STATE=$(docker exec mongo mongosh --quiet --eval "rs.status().myState" 2>/dev/null || echo "")
            [ "$STATE" = "1" ] && { echo "Primary elected."; break; }
            sleep 1
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mongodb,drf,dev]"

      - name: Run pytest against MongoDB
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_mongodb
          MONGODB_HOST: localhost
          MONGODB_PORT: "27017"
        run: python -m pytest --cov=shopify_toolkit --cov-report=term-missing