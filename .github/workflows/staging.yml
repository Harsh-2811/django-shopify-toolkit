name: Staging (TestPyPI)

# Push to `staging` -> full test suite -> build -> publish to TestPyPI.
# Safe to push repeatedly: if this exact version is already on TestPyPI,
# the publish step is skipped instead of failing the whole pipeline (PyPI
# rejects re-uploading an existing version+file, so this just avoids a
# noisy failure on every push that doesn't bump the version).
on:
  push:
    branches: ["staging"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      already_published: ${{ steps.check.outputs.already_published }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Check whether this version is already on TestPyPI
        id: check
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://test.pypi.org/pypi/django-shopify-toolkit/${{ steps.version.outputs.version }}/json")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.version.outputs.version }} is already on TestPyPI — will skip publishing."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.already_published == 'false'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  skipped:
    needs: build
    if: needs.build.outputs.already_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipped publish — version ${{ needs.build.outputs.version }} is already on TestPyPI. Bump the version to publish again."
