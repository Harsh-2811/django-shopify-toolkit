name: Staging (TestPyPI)

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

concurrency:
  group: staging-publish
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Compute unique dev version for this run
        id: version
        run: |
          BASE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          DEV_VERSION="${BASE_VERSION}.dev${{ github.run_number }}"
          echo "version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          echo "Base version (from pyproject.toml): $BASE_VERSION"
          echo "Publishing to TestPyPI as: $DEV_VERSION"

      - name: Patch build-time version (not committed)
        run: |
          python -c "
          import re
          path = 'pyproject.toml'
          content = open(path).read()
          content = re.sub(
              r'^version = \".*\"',
              'version = \"${{ steps.version.outputs.version }}\"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          open(path, 'w').write(content)
          "

      - name: Build
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Report outcome
        run: |
          echo "Published ${{ needs.build.outputs.version }} to TestPyPI (or it already existed and was skipped)."