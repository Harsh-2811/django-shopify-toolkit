name: Production (PyPI)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: production-publish
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Verify __init__.py version matches pyproject.toml
        run: |
          INIT_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/shopify_toolkit/__init__.py').read()).group(1))")
          if [ "$INIT_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Version mismatch: pyproject.toml=${{ steps.version.outputs.version }} vs __init__.py=$INIT_VERSION"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  tag:
    needs: [build, publish]
   
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the release commit
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on origin — skipping."
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "Pushed tag v$VERSION."
          fi