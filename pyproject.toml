[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-shopify-toolkit"
version = "1.2.0"
description = "A reusable, installable Django app for Shopify Admin GraphQL integration — multi-tenant, encrypted tokens, rate-limit aware."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "django-shopify-toolkit contributors" },
]
keywords = ["django", "shopify", "graphql", "ecommerce"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2,<6.0",
    "requests>=2.28",
    "django-encrypted-model-fields>=0.6",
]

[project.optional-dependencies]
drf = [
    "djangorestframework>=3.14",
]
testing = [
    "responses>=0.23",
]
mongodb = [
    # django-mongodb-backend's major.minor must match Django's exactly (5.2.x backend <-> Django
    # 5.2, 6.0.x backend <-> Django 6.0, etc — verified against MongoDB's own compatibility
    # docs) — not just ">=". This package's own Django ceiling is <6.0 (pyproject.toml
    # dependencies), so pinned to the one Django minor (5.2) both ranges actually overlap on.
    # Bump this in lockstep if this package's Django ceiling ever moves.
    "django-mongodb-backend>=5.2,<5.3",
]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.1",
    "responses>=0.23",
    "psycopg2-binary>=2.9",
    "build",
    "twine",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shopify_toolkit"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = [".", "src"]

